<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cartelera de Películas</title>
    <style>
        body { background-color: #0d0d0c; color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        .navbar { background-color: #1a1a1a; padding: 20px 40px; border-bottom: 2px solid #e5b300; display: flex; justify-content: center; }
        h1 { margin: 0; font-size: 28px; color: #e5b300; text-transform: uppercase; letter-spacing: 2px; }
        
        .grid-cartelera { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); 
            gap: 30px; 
            padding: 40px; 
            max-width: 1200px; 
            margin: 0 auto; 
        }
        .movie-card { 
            background-color: #1a1a1a; 
            border-radius: 8px; 
            overflow: hidden; 
            transition: transform 0.3s ease, box-shadow 0.3s ease; 
            text-align: center;
        }
        .movie-card:hover { 
            transform: translateY(-10px); 
            box-shadow: 0 10px 20px rgba(229, 179, 0, 0.2); 
        }
        .poster-container { width: 100%; height: 330px; background-color: #2a2a2a; }
        .poster-img { width: 100%; height: 100%; object-fit: cover; }
        .movie-info { padding: 15px; }
        .movie-title { font-size: 18px; font-weight: bold; margin: 0 0 5px 0; color: #ffffff; text-decoration: none; display: block; }
        .movie-title:hover { color: #e5b300; }
        .movie-year { font-size: 14px; color: #888888; margin: 0; }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>Cartelera</h1>
    </div>

    <div class="grid-cartelera">
        {% for movie in movies %}
            <div class="movie-card">
                <a href="/movie/{{ movie.id }}">
                    <div class="poster-container">
                        {% if movie.poster_url %}
                            <img src="{{ movie.poster_url }}" alt="Póster de {{ movie.name }}" class="poster-img">
                        {% else %}
                            <img src="https://via.placeholder.com/220x330/2a2a2a/888888?text=Sin+Poster" alt="Sin imagen" class="poster-img">
                        {% endif %}
                    </div>
                </a>
                <div class="movie-info">
                    <a href="/movie/{{ movie.id }}" class="movie-title">{{ movie.name }}</a>
                    <p class="movie-year">{{ movie.publication_date.year }}</p>
                </div>
            </div>
        {% empty %}
            <p style="text-align: center; width: 100%; grid-column: 1 / -1;">No hay películas en cartelera.</p>
        {% endfor %}
    </div>
</body>
</html>
